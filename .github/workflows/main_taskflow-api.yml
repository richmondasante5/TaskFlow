name: Build and deploy Docker app to Azure Web App - taskflow-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: richmondtaskflowacr
  ACR_RESOURCE_GROUP: taskflow-rg
  IMAGE_NAME: taskflow-backend
  WEBAPP_NAME: taskflow-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database for CI tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: github
          POSTGRES_PASSWORD: github
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U github -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Spring Boot test database configuration
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow
      SPRING_DATASOURCE_USERNAME: github
      SPRING_DATASOURCE_PASSWORD: github
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:

      # 1. Get TaskFlow source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install the Java version used by TaskFlow
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # 3. Test and package Spring Boot application
      - name: Test and package backend
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean package

      # 4. Authenticate GitHub Actions with Azure using OIDC
      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9665A67BF0CD4042B1B3826EA5B313F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A3090F9D73F0476DA571B738FACD33C5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8B163BB06ADE4EADB52F880CAA940BDA }}

      # 5. Verify the correct Azure subscription
      - name: Verify Azure account
        run: |
          az account show \
            --query "{Subscription:name, SubscriptionId:id}" \
            --output table

      # 6. Get the ACR login server
      - name: Get ACR login server
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$ACR_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

      # 7. Authenticate Docker with Azure Container Registry
      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # 8. Build and push Docker image
      - name: Build and push Docker image
        working-directory: ./backend
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      # 9. Verify that GitHub Actions can see the App Service
      - name: Verify App Service exists
        run: |
          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$ACR_RESOURCE_GROUP" \
            --query "{name:name, resourceGroup:resourceGroup, state:state}" \
            --output table

      # 10. Deploy the new container image to Azure App Service
      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: Production
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 11. End Azure CLI session
      - name: Log out of Azure
        if: always()
        run: az logout
